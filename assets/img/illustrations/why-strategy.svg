<svg viewBox="0 0 640 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of craft and measurable proof working together" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="640" height="460" fill="#EFEBE3"/>
  <circle cx="470" cy="330" r="180" fill="rgba(245,138,7,.10)"/>
  <circle cx="150" cy="120" r="130" fill="rgba(64,152,223,.10)"/>

  <!-- craft: idea card -->
  <g transform="translate(56 76)">
    <rect width="250" height="180" rx="20" fill="#0A0B0F"/>
    <path d="M125 44c-24 0-43 17-43 39 0 13 7 21 12 27 3 4 5 6 5 10v4h52v-4c0-4 2-6 5-10 5-6 12-14 12-27 0-22-19-39-43-39Z" stroke="#F58A07" stroke-width="5" stroke-linejoin="round" fill="none"/>
    <path d="M107 134h36M112 148h26" stroke="#F58A07" stroke-width="5" stroke-linecap="round"/>
    <circle cx="34" cy="34" r="6" fill="#DC141C"/>
    <circle cx="54" cy="34" r="6" fill="#ED9B18"/>
    <circle cx="74" cy="34" r="6" fill="#6FB353"/>
  </g>

  <!-- proof: metrics card -->
  <g transform="translate(300 190)">
    <rect width="284" height="200" rx="20" fill="#fff" stroke="rgba(10,11,15,.1)"/>
    <rect x="30" y="30" width="104" height="10" rx="5" fill="#0A0B0F" opacity=".75"/>
    <rect x="30" y="50" width="70" height="8" rx="4" fill="#0A0B0F" opacity=".22"/>
    <rect x="30" y="126" width="30" height="42" rx="8" fill="#4098DF"/>
    <rect x="72" y="106" width="30" height="62" rx="8" fill="#6FB353"/>
    <rect x="114" y="82" width="30" height="86" rx="8" fill="#F58A07"/>
    <path d="M166 150l30-36 26 22 32-52" stroke="#DC141C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="254" cy="84" r="6" fill="#DC141C"/>
  </g>

  <!-- partnership seal -->
  <g transform="translate(232 268)">
    <circle cx="56" cy="56" r="56" fill="#F58A07"/>
    <path d="M36 58l14 15 30-33" stroke="#14100A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- connecting dashes -->
  <g stroke="rgba(10,11,15,.2)" stroke-width="2" stroke-dasharray="6 9">
    <path d="M306 166h68M188 256v54"/>
  </g>

  <circle cx="592" cy="96" r="12" fill="#6FB353"/>
  <circle cx="52" cy="396" r="10" fill="#4098DF"/>
</svg>
